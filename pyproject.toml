[project]
name = "cdse-copernicus-land-helper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.118",
    "cartopy>=0.26.0",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "requests>=2.34.2",
    "rioxarray>=0.23.0",
    "tqdm>=4.70.1",
    "xarray>=2026.9.0",
    "xarray-regrid>=0.4.2",
]

[project.scripts]
cdse-copernicus-land-helper = "cdse_copernicus_land_helper:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
